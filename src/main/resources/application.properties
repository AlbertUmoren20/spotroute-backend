# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=${JWT_SECRET:spotroute-super-secret-key-change-in-production-min-32-chars}
jwt.expiration.ms=${JWT_EXPIRATION_MS:86400000}

# Flutterwave
flutterwave.secret-key=${FLUTTERWAVE_SECRET_KEY:}
flutterwave.public-key=${FLUTTERWAVE_PUBLIC_KEY:}
flutterwave.base-url=https://api.flutterwave.com/v3

# CORS — allow the React dev server
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5000}

# Logging
logging.level.com.spotroute=DEBUG
logging.level.org.springframework.security=WARN

#Kafka
spring.kafka.bootstrap.servers=localhost:9092
spring.kafka.consumer.group-id=spotroute-consumer-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.topic.name=ride-events


spring.kafka.producer.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
